workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Set up code signing
        script: |
          keychain initialize
          # Generate RSA key for certificate creation
          openssl genrsa -out ~/cert_key.pem 2048
          export CM_CERTIFICATE_PRIVATE_KEY="$(cat ~/cert_key.pem)"
          # Fetch or create signing files
          app-store-connect fetch-signing-files "com.craftstash.app" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "com.craftstash.app.share-extension" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

          # Extract profile names and signing identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)"/\1/')
          APP_PROFILE=""
          EXT_PROFILE=""
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            INFO=$(security cms -D -i "$f" 2>/dev/null)
            TEAM_BUNDLE=$(echo "$INFO" | grep -A1 "application-identifier" | grep "<string>" | head -1 | sed 's/.*<string>\(.*\)<\/string>/\1/')
            BUNDLE="${TEAM_BUNDLE#*.}"
            NAME=$(echo "$INFO" | grep -A1 "<key>Name</key>" | grep "<string>" | head -1 | sed 's/.*<string>\(.*\)<\/string>/\1/')
            echo "Found profile: $NAME for bundle: $BUNDLE"
            if [ "$BUNDLE" = "com.craftstash.app" ]; then
              APP_PROFILE="$NAME"
            elif [ "$BUNDLE" = "com.craftstash.app.share-extension" ]; then
              EXT_PROFILE="$NAME"
            fi
          done

          echo "App profile: $APP_PROFILE"
          echo "Ext profile: $EXT_PROFILE"
          echo "Identity: $IDENTITY"

          # Save for next steps
          echo "APP_PROFILE=$APP_PROFILE" >> $CM_ENV
          echo "EXT_PROFILE=$EXT_PROFILE" >> $CM_ENV
          echo "SIGN_IDENTITY=$IDENTITY" >> $CM_ENV

      - name: Generate Xcode project with signing
        script: |
          cd $CM_BUILD_DIR
          # Inject signing settings into project.yml
          sed -i '' "/PRODUCT_BUNDLE_IDENTIFIER: com.craftstash.app$/a\\
          \ \ \ \ \ \ \ \ PROVISIONING_PROFILE_SPECIFIER: $APP_PROFILE\\
          \ \ \ \ \ \ \ \ CODE_SIGN_IDENTITY: Apple Distribution" project.yml

          sed -i '' "/PRODUCT_BUNDLE_IDENTIFIER: com.craftstash.app.share-extension$/a\\
          \ \ \ \ \ \ \ \ PROVISIONING_PROFILE_SPECIFIER: $EXT_PROFILE\\
          \ \ \ \ \ \ \ \ CODE_SIGN_IDENTITY: Apple Distribution" project.yml

          echo "=== Updated project.yml ==="
          cat project.yml

          xcodegen generate

          echo "=== Verify signing in pbxproj ==="
          grep -A2 "PROVISIONING_PROFILE" CraftStash.xcodeproj/project.pbxproj | head -20 || true

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR

          # Write exportOptions.plist with correct profile mapping
          cat > exportOptions.plist << PLISTEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9959PXX99M</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.craftstash.app</key>
                  <string>$APP_PROFILE</string>
                  <key>com.craftstash.app.share-extension</key>
                  <string>$EXT_PROFILE</string>
              </dict>
          </dict>
          </plist>
          PLISTEOF

          echo "=== exportOptions.plist ==="
          cat exportOptions.plist

          xcodebuild archive \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CraftStash.xcarchive \
            DEVELOPMENT_TEAM=9959PXX99M

          xcodebuild -exportArchive \
            -archivePath build/CraftStash.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/CraftStash.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
