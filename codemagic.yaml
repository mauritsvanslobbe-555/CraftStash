workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Set up code signing
        script: |
          keychain initialize
          openssl genrsa -out ~/cert_key.pem 2048
          export CM_CERTIFICATE_PRIVATE_KEY="$(cat ~/cert_key.pem)"
          app-store-connect fetch-signing-files "com.craftstash.app" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.craftstash.app.share-extension" --type IOS_APP_STORE --create
          keychain add-certificates

          # Debug: list all profiles
          echo "=== Profiles directory ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles"

          # Extract profile names using plistutil-style parsing
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "=== Processing: $(basename "$f") ==="
            security cms -D -i "$f" > /tmp/profile_info.plist 2>/dev/null
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_info.plist 2>/dev/null)
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile_info.plist 2>/dev/null)
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_info.plist 2>/dev/null)
            BUNDLE="${APPID#*.}"
            echo "  Name: $NAME"
            echo "  UUID: $UUID"
            echo "  AppID: $APPID"
            echo "  Bundle: $BUNDLE"
            if [ "$BUNDLE" = "com.craftstash.app" ]; then
              echo "APP_PROFILE=$NAME" >> $CM_ENV
              echo "APP_UUID=$UUID" >> $CM_ENV
            elif [ "$BUNDLE" = "com.craftstash.app.share-extension" ]; then
              echo "EXT_PROFILE=$NAME" >> $CM_ENV
              echo "EXT_UUID=$UUID" >> $CM_ENV
            fi
          done

          # Get signing identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> $CM_ENV
          echo "=== Signing identity: $IDENTITY ==="

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Apply signing to Xcode project
        script: |
          cd $CM_BUILD_DIR
          echo "Using profiles: APP=$APP_PROFILE, EXT=$EXT_PROFILE, IDENTITY=$SIGN_IDENTITY"
          ruby << 'RUBYEOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('CraftStash.xcodeproj')
          app_profile = ENV['APP_PROFILE'] || ''
          ext_profile = ENV['EXT_PROFILE'] || ''
          identity = ENV['SIGN_IDENTITY'] || 'Apple Distribution'
          puts "Setting app profile: #{app_profile}"
          puts "Setting ext profile: #{ext_profile}"
          puts "Setting identity: #{identity}"
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = '9959PXX99M'
              config.build_settings['CODE_SIGN_IDENTITY'] = identity
              if target.name == 'CraftStash'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = app_profile
              elsif target.name == 'CraftStashShareExtension'
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ext_profile
              end
            end
          end
          project.save
          puts "Project saved with signing settings"
          RUBYEOF

          echo "=== Verify signing in pbxproj ==="
          grep "PROVISIONING_PROFILE_SPECIFIER" CraftStash.xcodeproj/project.pbxproj || echo "NOT FOUND"

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcodebuild archive \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CraftStash.xcarchive \
            DEVELOPMENT_TEAM=9959PXX99M

          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>9959PXX99M</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.craftstash.app</key>
              <string>${APP_PROFILE}</string>
              <key>com.craftstash.app.share-extension</key>
              <string>${EXT_PROFILE}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/CraftStash.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/CraftStash.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
