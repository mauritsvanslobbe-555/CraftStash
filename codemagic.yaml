workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up code signing
        script: |
          keychain initialize
          # Generate fresh RSA key for certificate creation
          openssl genrsa -out ~/cert_key.pem 2048
          export CM_CERTIFICATE_PRIVATE_KEY="$(cat ~/cert_key.pem)"
          # Fetch or create signing files
          app-store-connect fetch-signing-files "com.craftstash.app" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "com.craftstash.app.share-extension" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          # Debug: list profiles
          echo "=== Installed profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles dir"
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "--- Profile: $(basename $f) ---"
            security cms -D -i "$f" 2>/dev/null | grep -E "<key>(Name|TeamIdentifier|application-identifier)" -A1 | head -12
          done
          # Apply profiles and auto-generate export options
          xcode-project use-profiles --export-options-plist "$CM_BUILD_DIR/exportOptions.plist"
          echo "=== exportOptions.plist ==="
          cat "$CM_BUILD_DIR/exportOptions.plist"
          echo "=== Project PROVISIONING_PROFILE settings ==="
          grep -A2 "PROVISIONING_PROFILE" "$CM_BUILD_DIR/CraftStash.xcodeproj/project.pbxproj" | head -20 || true

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcodebuild archive \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CraftStash.xcarchive \
            DEVELOPMENT_TEAM=9959PXX99M

          xcodebuild -exportArchive \
            -archivePath build/CraftStash.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/CraftStash.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
