workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Find API key and set up signing
        script: |
          echo "=== Looking for API key files ==="
          ls -la ~/private_keys/ 2>/dev/null || echo "No ~/private_keys"
          ls -la $HOME/private_keys/ 2>/dev/null || echo "No HOME/private_keys"
          find / -name "AuthKey_*.p8" 2>/dev/null | head -5 || echo "No AuthKey found"
          find / -name "*.p8" 2>/dev/null | head -5 || echo "No .p8 found"
          echo "=== App Store Connect env vars ==="
          echo "KEY_ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID"
          echo "PRIVATE_KEY var length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          echo "PRIVATE_KEY first 50 chars: $(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | head -c 50)"
          echo "=== Try writing key with printf ==="
          mkdir -p ~/private_keys
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey.p8
          echo "Key file size: $(wc -c < ~/private_keys/AuthKey.p8)"
          head -2 ~/private_keys/AuthKey.p8
          echo "=== Keychain and cert setup ==="
          keychain initialize
          openssl genrsa -out ~/cert_key.pem 2048
          export CM_CERTIFICATE_PRIVATE_KEY="$(cat ~/cert_key.pem)"
          app-store-connect fetch-signing-files "com.craftstash.app" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.craftstash.app.share-extension" --type IOS_APP_STORE --create
          keychain add-certificates
          echo "=== Installed profiles ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            security cms -D -i "$f" > /tmp/pinfo.plist 2>/dev/null
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/pinfo.plist 2>/dev/null)
            APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/pinfo.plist 2>/dev/null)
            GROUPS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" /tmp/pinfo.plist 2>/dev/null)
            echo "Profile: $NAME | AppID: $APPID | Groups: $GROUPS"
          done
          echo "=== Signing identities ==="
          security find-identity -v -p codesigning

      - name: Apply signing to project
        script: |
          cd $CM_BUILD_DIR
          gem list xcodeproj 2>/dev/null || echo "xcodeproj gem not found"
          which ruby && ruby --version
          ruby -e "require 'xcodeproj'; puts 'xcodeproj gem OK'" 2>/dev/null || echo "CANNOT LOAD xcodeproj gem"
          echo "=== Trying xcode-project use-profiles ==="
          xcode-project use-profiles --project CraftStash.xcodeproj 2>&1 || echo "use-profiles failed"
          echo "=== Check result ==="
          grep "PROVISIONING_PROFILE_SPECIFIER" CraftStash.xcodeproj/project.pbxproj || echo "NO PROFILE SPECIFIER SET"

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          echo "=== Attempting build ==="
          xcodebuild archive \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CraftStash.xcarchive \
            DEVELOPMENT_TEAM=9959PXX99M

          xcodebuild -exportArchive \
            -archivePath build/CraftStash.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/CraftStash.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
