workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
        BUNDLE_ID: "com.craftstash.app"
        EXTENSION_BUNDLE_ID: "com.craftstash.app.share-extension"
        APP_STORE_APPLE_ID: "6746428527"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up code signing
        script: |
          # 1. Initialize keychain
          keychain initialize

          # 2. Generate RSA private key for new certificate
          openssl genrsa -out /tmp/cert_key.pem 2048
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"

          # 3. Revoke ALL existing Distribution certificates via App Store Connect API
          #    Apple allows max 2 Distribution certs and both slots are taken with
          #    lost private keys. We must revoke them to create a new one.
          pip3 install PyJWT --break-system-packages 2>/dev/null || pip3 install PyJWT

          python3 <<'REVOKE_SCRIPT'
import jwt, json, time, os
from urllib.request import Request, urlopen
from urllib.error import HTTPError

key_id = os.environ.get('APP_STORE_CONNECT_KEY_IDENTIFIER', '')
issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '')
private_key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')

if not all([key_id, issuer_id, private_key]):
    print("WARNING: Missing App Store Connect credentials!")
    print(f"  KEY_IDENTIFIER set: {bool(key_id)}")
    print(f"  ISSUER_ID set: {bool(issuer_id)}")
    print(f"  PRIVATE_KEY set: {bool(private_key)}")
    exit(0)

print(f"Using Key ID: {key_id}")
print(f"Using Issuer ID: {issuer_id}")

# Create JWT token for App Store Connect API
token = jwt.encode(
    {
        'iss': issuer_id,
        'iat': int(time.time()),
        'exp': int(time.time()) + 1200,
        'aud': 'appstoreconnect-v1',
    },
    private_key,
    algorithm='ES256',
    headers={'kid': key_id},
)

headers = {'Authorization': f'Bearer {token}'}

# List all Distribution certificates
print("\n=== Listing Distribution certificates ===")
try:
    req = Request(
        'https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION',
        headers=headers,
    )
    resp = urlopen(req)
    data = json.loads(resp.read())
    certs = data.get('data', [])
    print(f"Found {len(certs)} Distribution certificate(s)")

    for cert in certs:
        cert_id = cert['id']
        attrs = cert.get('attributes', {})
        cert_name = attrs.get('name', 'unknown')
        cert_type = attrs.get('certificateType', 'unknown')
        print(f"\n  Revoking: {cert_name} (type={cert_type}, id={cert_id})")
        try:
            del_req = Request(
                f'https://api.appstoreconnect.apple.com/v1/certificates/{cert_id}',
                method='DELETE',
                headers=headers,
            )
            urlopen(del_req)
            print(f"  ✓ Revoked successfully")
        except HTTPError as e:
            body = e.read().decode()
            print(f"  ✗ Error {e.code}: {body[:300]}")
except HTTPError as e:
    body = e.read().decode()
    print(f"Error listing certificates: {e.code} {body[:500]}")
except Exception as e:
    print(f"Unexpected error: {e}")

print("\n=== Certificate revocation complete ===\n")
REVOKE_SCRIPT

          # 4. Fetch signing files — will create NEW cert + profiles now
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          # 5. Import certificates into keychain
          keychain add-certificates

          # 6. Set profiles on Xcode project
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --project CraftStash.xcodeproj \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - build/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
