workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
        BUNDLE_ID: "com.craftstash.app"
        EXTENSION_BUNDLE_ID: "com.craftstash.app.share-extension"
        APP_STORE_APPLE_ID: "6746428527"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          keychain initialize

          # Generate RSA key for new certificate
          openssl genrsa -out /tmp/cert_key.pem 2048

          # Always revoke ALL existing Distribution certificates first.
          # Each build generates a fresh private key, so old certs never match.
          echo "=== Revoking all existing Distribution certificates ==="

          # Debug: show raw list output (both DISTRIBUTION and IOS_DISTRIBUTION)
          echo "--- Raw certificate list output ---"
          set +e
          app-store-connect certificates list \
            --type DISTRIBUTION \
            --type IOS_DISTRIBUTION 2>&1 | head -50
          echo "--- End raw output ---"

          # Try to get IDs and delete them
          CERT_IDS=$(app-store-connect certificates list \
            --type DISTRIBUTION \
            --type IOS_DISTRIBUTION \
            --json 2>&1 | python3 -c "
import json, sys
try:
    data = json.load(sys.stdin)
    if isinstance(data, list):
        for c in data:
            print(c.get('id', ''))
    elif isinstance(data, dict):
        for c in data.get('data', []):
            print(c.get('id', ''))
except Exception as e:
    print(f'PARSE_ERROR: {e}', file=sys.stderr)
" 2>&1) || true
          set -e

          echo "Found cert IDs: $CERT_IDS"

          for CERT_ID in $CERT_IDS; do
            if [ -n "$CERT_ID" ] && [[ ! "$CERT_ID" == PARSE_ERROR* ]]; then
              echo "Revoking certificate: $CERT_ID"
              app-store-connect certificates delete "$CERT_ID" --ignore-not-found || true
            fi
          done
          echo "=== Done revoking ==="

          # Now fetch signing files + create new certificate and profiles
          echo "=== Fetching signing files for main app ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create

          echo "=== Fetching signing files for share extension ==="
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create

          keychain add-certificates

          echo "=== Downloaded profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "No profiles found!"
          ls -la "$HOME/Library/MobileDevice/Certificates/" 2>/dev/null || echo "No certificates found!"

          xcode-project use-profiles --project "$CM_BUILD_DIR/CraftStash.xcodeproj"

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --project CraftStash.xcodeproj \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - build/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
