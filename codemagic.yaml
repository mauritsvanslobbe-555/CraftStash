workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up code signing
        script: |
          keychain initialize

          # Write App Store Connect API key to file for xcodebuild
          # The env var may contain literal \n or real newlines
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8

          # Verify the key file is valid PEM
          echo "=== API Key file debug ==="
          ls -la /tmp/AuthKey.p8
          wc -l /tmp/AuthKey.p8
          head -1 /tmp/AuthKey.p8
          tail -1 /tmp/AuthKey.p8

          # If the file doesn't start with BEGIN, try sed replacement
          if ! head -1 /tmp/AuthKey.p8 | grep -q "BEGIN"; then
            echo "Key doesn't look like PEM, trying sed replacement..."
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/\\n/\'$'\n''/g' > /tmp/AuthKey.p8
            echo "After sed fix:"
            head -1 /tmp/AuthKey.p8
            tail -1 /tmp/AuthKey.p8
            wc -l /tmp/AuthKey.p8
          fi

          # Create automatic signing export options using PlistBuddy
          /usr/libexec/PlistBuddy -c "Clear dict" /tmp/exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" /tmp/exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string 9959PXX99M" /tmp/exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" /tmp/exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" /tmp/exportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" /tmp/exportOptions.plist
          echo "=== Export options ==="
          cat /tmp/exportOptions.plist

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcodebuild archive \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CraftStash.xcarchive \
            DEVELOPMENT_TEAM=9959PXX99M \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID

          xcodebuild -exportArchive \
            -archivePath build/CraftStash.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID

    artifacts:
      - build/ipa/*.ipa
      - build/CraftStash.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
