workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      ios_signing:
        certificates:
          - StuffStash Distribution
        provisioning_profiles:
          - craftstash_appstore_v2
          - craftstash_share_extension_appstore_v2
      vars:
        XCODE_SCHEME: "CraftStash"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates

          # Debug: show available signing identities
          echo "=== Signing identities in keychain ==="
          security find-identity -p codesigning -v

          # Debug: check CERTIFICATE_PRIVATE_KEY
          echo "=== CERTIFICATE_PRIVATE_KEY set? ==="
          [ -n "$CERTIFICATE_PRIVATE_KEY" ] && echo "YES" || echo "NO"

          # Extract private key from installed .p12 certificate
          P12_FILE=$(find /Users/builder/Library -name "*.p12" 2>/dev/null | head -1)
          echo "=== Found .p12 file: $P12_FILE ==="

          if [ -n "$P12_FILE" ]; then
            openssl pkcs12 -in "$P12_FILE" -nocerts -nodes -out /tmp/cert_key.pem -passin pass: 2>/dev/null || true
            if [ -f /tmp/cert_key.pem ] && [ -s /tmp/cert_key.pem ]; then
              export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
              echo "Private key extracted successfully"
            else
              echo "Could not extract key with empty password, trying with CM password"
              openssl pkcs12 -in "$P12_FILE" -nocerts -nodes -out /tmp/cert_key.pem -legacy -passin pass: 2>/dev/null || true
              if [ -f /tmp/cert_key.pem ] && [ -s /tmp/cert_key.pem ]; then
                export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
                echo "Private key extracted with legacy flag"
              fi
            fi
          fi

          # Fetch signing files with the extracted private key
          app-store-connect fetch-signing-files com.craftstash.app --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files com.craftstash.app.share-extension --type IOS_APP_STORE --create

          # Re-add any new certificates
          keychain add-certificates

          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcodebuild archive \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/CraftStash.xcarchive \
            DEVELOPMENT_TEAM=9959PXX99M \
            -allowProvisioningUpdates

          xcodebuild -exportArchive \
            -archivePath build/CraftStash.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

    artifacts:
      - build/ipa/*.ipa
      - build/CraftStash.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
