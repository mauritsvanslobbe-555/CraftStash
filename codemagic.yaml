workflows:
  ios-build:
    name: CraftStash iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodeMagic1

    environment:
      vars:
        XCODE_SCHEME: "CraftStash"
        BUNDLE_ID: "com.craftstash.app"
        EXTENSION_BUNDLE_ID: "com.craftstash.app.share-extension"
        APP_STORE_APPLE_ID: "6746428527"
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up code signing
        script: |
          set -e
          keychain initialize

          # Generate RSA key for new certificate
          openssl genrsa -out /tmp/cert_key.pem 2048

          # Try to fetch signing files; if 409 (max certs), revoke and retry
          echo "=== Fetching signing files for main app ==="
          if ! app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create 2>&1 | tee /tmp/fetch1.log; then

            echo "=== Initial fetch failed, revoking old certificates ==="
            CERT_IDS=$(app-store-connect certificates list \
              --type IOS_DISTRIBUTION \
              --json | python3 -c "import json,sys;[print(c['id']) for c in json.load(sys.stdin)]") || true

            for CERT_ID in $CERT_IDS; do
              echo "Revoking certificate: $CERT_ID"
              app-store-connect certificates delete "$CERT_ID" --ignore-not-found || true
            done

            echo "=== Retrying fetch after revocation ==="
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/cert_key.pem \
              --create
          fi

          echo "=== Fetching signing files for share extension ==="
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create

          keychain add-certificates

          echo "=== Downloaded profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "No profiles found!"
          ls -la "$HOME/Library/MobileDevice/Certificates/" 2>/dev/null || echo "No certificates found!"

          xcode-project use-profiles --project "$CM_BUILD_DIR/CraftStash.xcodeproj"

      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --project CraftStash.xcodeproj \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - build/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  ios-test:
    name: CraftStash iOS Test (No signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 26.0

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: List available simulators
        script: |
          xcrun simctl list devices available

      - name: Build for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project CraftStash.xcodeproj \
            -scheme CraftStash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - /tmp/xcodebuild_logs/*.log
